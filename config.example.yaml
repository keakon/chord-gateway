# Example gateway configuration.
# Unsupported general keys are reported and ignored; malformed authorization fields are rejected.
#
# The gateway looks for config in this order:
#   1. --config flag
#   2. $CHORD_GATEWAY_CONFIG
#   3. $XDG_CONFIG_HOME/chord-gateway/config.yaml
#   4. ~/.config/chord-gateway/config.yaml
#
# Runtime state (logs, WeChat QR-login tokens, dedupe, session pins, transfer guards) goes to:
#   1. $CHORD_GATEWAY_STATE_DIR
#   2. $XDG_STATE_HOME/chord-gateway
#   3. ~/.local/state/chord-gateway
#
# New installations: pairing needs no owner IDs or workspace routes.
# Run chord-gateway --pair in a foreground terminal; see docs/pairing.md.
# Feishu chats require chat_bindings or a successful /bind before use, even with one workspace.

# --- IM Platform Configuration ---
# Configure adapters explicitly under `ims`.
ims:
  wechat:
    base_url: https://ilinkai.weixin.qq.com  # optional, defaults to this
    # Optional. Defaults to <state_dir>/wechat/token.json.
    # Use this only when you want to store the WeChat QR-login session token elsewhere.
    # token_path: ~/.local/state/chord-gateway/wechat/token.json

  # feishu:
  #   app_id: cli_xxx
  #   app_secret: xxx

# Paired /bind registers existing directories and chat bindings here.
workspaces: {}

# --- Chord Binary ---
# Path to the chord binary. Supports ~ expansion.
# Shell aliases are NOT supported because the gateway uses exec directly;
# use an absolute/~/path or add the binary's directory to your PATH.
chord_path: chord

# Optional Chord state directory, shared by managed headless and takeover CLI.
# This is separate from the gateway state directory above. Leave unset for
# Chord's default; set it to the same directory as a TUI using --state-dir.
# chord_state_dir: ~/.local/state/chord

# --- Session Idle Timeout ---
# How long to wait before terminating an idle chord process.
idle_timeout: 30m

# --- Optional: Control-Plane Event Subscriptions ---
# Only non-essential events are controllable here. Essential events include
# assistant_message, requests, idle/error, Done reports, local shell results,
# SubAgent completion summaries, and session transfer events; they are always subscribed.
# background_result is enabled by default; set it to false to stop pushing
# finished background job results to the chat.
event_visibility:
  background_result: true
  agent_started: false
  agent_notify: false
  context_notice: false
  info: false
  toast: false
  todos: false

# --- Optional: Session Pins Store ---
# Path to the session pin store (one pin per owner and explicit chat binding).
# If omitted, defaults to <state_dir>/session-pins.json.
# session_pins_file: ~/.local/state/chord-gateway/session-pins.json
