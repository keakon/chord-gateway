name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          commit="$(git rev-parse --short HEAD)"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist build

          targets=(
            "darwin amd64"
            "darwin arm64"
            "linux amd64"
            "linux arm64"
            "windows amd64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<< "${target}"
            name="chord-gateway-${version}-${goos}-${goarch}"
            ext=""
            if [[ "${goos}" == "windows" ]]; then
              ext=".exe"
            fi

            out="build/${name}/chord-gateway${ext}"
            mkdir -p "$(dirname "${out}")"

            build_env=(GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0)
            # Every Apple Silicon chip implements ARMv8.1+; linux/arm64 still
            # covers v8.0 boards without LSE atomics, so raise the baseline only here.
            if [[ "${goos}" == "darwin" && "${goarch}" == "arm64" ]]; then
              build_env+=(GOARM64=v8.1)
            fi

            # Stamp the build identity explicitly: the v0.3.4 release fell back to
            # VCS stamping and misreported a clean checkout as dirty (`--version`
            # showed a `*`). buildinfo.go documents this exact ldflags set.
            env "${build_env[@]}" go build -trimpath -ldflags "-s -w \
              -X github.com/keakon/chord-gateway/internal/buildinfo.Version=${version} \
              -X github.com/keakon/chord-gateway/internal/buildinfo.Commit=${commit} \
              -X github.com/keakon/chord-gateway/internal/buildinfo.BuildTime=${build_time} \
              -X github.com/keakon/chord-gateway/internal/buildinfo.Dirty=false" \
              -o "${out}" .

            cp LICENSE "build/${name}/"
            if [[ "${goos}" == "windows" ]]; then
              (cd build && zip -qr "../dist/${name}.zip" "${name}")
            else
              tar -C build -czf "dist/${name}.tar.gz" "${name}"
            fi
          done

          (cd dist && sha256sum * > SHA256SUMS)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  homebrew:
    needs: release
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
