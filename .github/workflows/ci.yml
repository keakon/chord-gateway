name: ci

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  test:
    name: Test with coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        env:
          MIN_COVERAGE: "70.0"
        shell: bash
        run: |
          set -euo pipefail
          coverage_file="coverage.out"
          # -coverpkg=./... must match scripts/check-go-quality.sh. Without it a
          # test only instruments its own package, which reported 65.1% for this
          # tree while the local gate reported 83.3% against the same 70.0%
          # threshold, so the two halves of one gate disagreed.
          go test -short -timeout=5m -coverprofile="${coverage_file}" -coverpkg=./... ./...
          cover_output="$(go tool cover -func="${coverage_file}")"
          printf '%s\n' "${cover_output}"
          total_coverage="$(printf '%s\n' "${cover_output}" | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          if [[ -z "${total_coverage}" ]]; then
            echo "failed to parse total coverage" >&2
            exit 1
          fi
          awk -v total="${total_coverage}" -v min="${MIN_COVERAGE}" 'BEGIN {
            if (total + 0 < min + 0) {
              printf("coverage check failed: total %.1f%% < required %.1f%%\n", total + 0, min + 0)
              exit 1
            }
            printf("coverage check passed: total %.1f%% >= required %.1f%%\n", total + 0, min + 0)
          }'

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -short -timeout=5m ./...

  build:
    name: Cross-platform build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The gopls gate only selects the files the runner's platform compiles,
      # so platform-twin files receive no analysis anywhere else.
      - name: Build every supported target
        run: ./scripts/check_build_matrix.sh

  contract:
    name: Chord process contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Clone companion Chord
        run: git clone --branch main --single-branch https://github.com/keakon/chord ../chord
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: ./scripts/check-chord-contract.sh
        env:
          CHORD_GATEWAY_CONTRACT_CHORD_REPO: ${{ github.workspace }}/../chord

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: |
          go vet ./...

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Staticcheck
        run: |
          staticcheck -checks 'all,-ST1000' ./...

  gopls:
    name: Gopls diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gopls
        run: |
          go install golang.org/x/tools/gopls@latest

      - name: Gopls check
        run: scripts/check_gopls.sh

  gofmt:
    name: Check Go formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Check goimports
        shell: bash
        run: |
          set -euo pipefail
          out="$(goimports -l -local github.com/keakon/chord-gateway .)"
          if [[ -n "${out}" ]]; then
            echo "The following files need goimports formatting:"
            echo "${out}"
            echo "Run: goimports -w -local github.com/keakon/chord-gateway ."
            exit 1
          fi
